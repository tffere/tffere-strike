name: Headless training mechanics
on:
  push:
    paths: ['native/training/**', 'native/gameplay.hpp', '.github/workflows/training.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanics:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native/training -B training-build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build training-build --config Release --parallel 2
      - run: ctest --test-dir training-build -C Release --output-on-failure

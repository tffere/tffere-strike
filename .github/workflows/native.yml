name: Native desktop game
on:
  push:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ game
        run: cmake -S native -B native-build -A x64
      - name: Build release
        run: cmake --build native-build --config Release --parallel 2
      - name: Test gameplay
        run: ctest --test-dir native-build -C Release --output-on-failure
      - name: Prepare portable game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TffereStrike
          Copy-Item native-build/Release/TffereStrike.exe TffereStrike/
          Copy-Item -Recurse native-build/Release/assets TffereStrike/assets
          Copy-Item native-build/Release/LICENSE-raylib.txt TffereStrike/
          @'
          Extract the entire folder and double-click TffereStrike.exe.
          Keep assets next to the executable. No Node.js or browser is needed.
          WASD move, mouse look/fire, 1 rifle, 2 sniper, right-click scope,
          R reload, Space jump, Shift sprint, Ctrl crouch, Alt slow walk,
          F5 expanded V3 / v1.7 baseline, Escape pause, Enter deploy.
          Windows x64 and an OpenGL 3.3 graphics driver are required.
          '@ | Set-Content TffereStrike/READ-ME.txt
      - name: Scan portable game with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanner = Get-ChildItem 'C:/ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $scanner) {
            $fallback = 'C:/Program Files/Windows Defender/MpCmdRun.exe'
            if (Test-Path $fallback) { $scanner = Get-Item $fallback }
          }
          if (-not $scanner) { throw 'Microsoft Defender scanner is unavailable; no scan result can be claimed.' }
          try {
            Update-MpSignature -ErrorAction Stop | Out-String | Set-Content defender-signature-update.txt
          } catch {
            $_ | Out-String | Set-Content defender-signature-update.txt
            Write-Warning 'Signature update failed; scan status below records the actual definition date.'
          }
          $status = Get-MpComputerStatus
          $status | Select-Object AMProductVersion, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List | Out-String | Set-Content defender-scan.txt
          & $scanner.FullName -Scan -ScanType 3 -File "$PWD/TffereStrike" -DisableRemediation 2>&1 | Tee-Object -FilePath defender-scan.txt -Append
          $scanExit = $LASTEXITCODE
          "Scanner exit code: $scanExit" | Add-Content defender-scan.txt
          if ($scanExit -ne 0) { throw "Defender scan failed or detected a threat (exit $scanExit)." }
          Get-FileHash TffereStrike/TffereStrike.exe -Algorithm SHA256 | Format-List | Out-String | Add-Content defender-scan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TffereStrike-Windows-x64
          path: |
            TffereStrike/
            defender-scan.txt
            defender-signature-update.txt
